; Mirrors the restrictions of the target shared hosting (CLAUDE.md section 1,
; docs/hosting-befunde.md). Where dev and host differ, dev is the stricter of
; the two, so whatever runs here runs there as well.

; No process calls from PHP. The host does not block them (disable_functions
; is empty there) - this is a self-restriction, enforced here so a violation
; fails in development, and by tests/Support/NoShellExecutionTest.php.
disable_functions = exec,passthru,popen,proc_open,shell_exec,system,pcntl_exec

; The host measured 384 MiB and 60 s; 256 MiB and 30 s keep every request
; and every step of a step chain comfortably inside the real limits.
memory_limit = 256M
max_execution_time = 30
upload_max_filesize = 16M
post_max_size = 16M
expose_php = Off

; Keep function arguments OUT of exception stack traces (CLAUDE.md section 4):
; a logged trace of a failing login would otherwise carry the plaintext
; password. The host ships this off, so bootstrap.php sets it at runtime as
; well and the error handler never logs the full exception string.
zend.exception_ignore_args = On
zend.exception_string_param_max_len = 0

; Deliberately NOT Europe/Berlin: only the bootstrap may set the timezone, so
; any code path that bypasses it shows up as a time offset in development.
date.timezone = UTC

; Dev convenience (production has this off, docker/web/.user.ini).
display_errors = On
error_reporting = E_ALL

; OPcache is active on the host as well. The base image tunes it for
; production (revalidate every 60 s); in development a changed file has to
; count on the next request.
opcache.revalidate_freq = 0
