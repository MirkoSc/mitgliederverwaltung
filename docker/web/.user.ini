; Safety net for the window before bootstrap.php runs: the target host ships
; zend.exception_ignore_args = 0, so without this a fatal error BEFORE the
; bootstrap (a syntax error in the autoloader, a failing require) would print
; and log a stack trace including its call arguments - a password, say.
;
; .user.ini and not .htaccess on purpose: the host runs PHP as fpm-fcgi,
; where php_value/php_flag in .htaccess answers every request with a 500.
;
; PHP reads .user.ini from the executed script's directory upwards, and the
; executed script is the shim in the docroot - so this file belongs next to
; it, not into current/.
zend.exception_ignore_args = On
; Second layer: caps every string parameter in a trace to '...'.
zend.exception_string_param_max_len = 0
display_errors = Off
