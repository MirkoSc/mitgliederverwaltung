# Runs after every CI run on an issue-<nr> PR branch:
#   CI red        -> Claude (issue model) fixes, push, CI runs again
#   main moved    -> merge main; on conflict Claude resolves; push, CI again
#   up to date    -> Claude Opus reviews; approve -> squash-merge + close issue,
#                    otherwise Claude fixes the findings, push, CI again
# After MAX_RUNDEN fix rounds the issue gets "braucht-hilfe".
name: Pruefen
run-name: "Prüfen ${{ github.event.workflow_run.head_branch || inputs.branch }}"

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      branch:
        description: Branch issue-<nr>
        required: true

concurrency:
  group: pruefen-${{ github.event.workflow_run.head_branch || inputs.branch }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  id-token: write

jobs:
  pruefen:
    if: >-
      vars.AUTOMATIK == 'an' &&
      startsWith(github.event.workflow_run.head_branch || inputs.branch, 'issue-') &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BRANCH: ${{ github.event.workflow_run.head_branch || inputs.branch }}
      CI_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'success' }}
      CI_RUN_ID: ${{ github.event.workflow_run.id }}
      CI_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ secrets.AUTOMATIK_TOKEN }}
      MAX_RUNDEN: ${{ vars.MAX_RUNDEN || '5' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || inputs.branch }}
          fetch-depth: 0

      - name: Assess situation
        id: lage
        uses: actions/github-script@v7
        with:
          script: |
            const branch = process.env.BRANCH;
            const issueNr = Number(branch.replace('issue-', ''));
            const stop = why => { core.info(`stop: ${why}`); core.setOutput('modus', 'stop'); };
            const prs = await github.rest.pulls.list({ ...context.repo, state: 'open', head: `${context.repo.owner}:${branch}` });
            if (!prs.data.length) return stop('no open PR');
            const pr = prs.data[0];
            if (process.env.CI_SHA && pr.head.sha !== process.env.CI_SHA) return stop('CI result is for an older commit');

            const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number: issueNr });
            const names = issue.labels.map(l => typeof l === 'string' ? l : l.name);
            if (names.includes('braucht-hilfe')) return stop('issue needs help');
            const models = { opus: 'claude-opus-5-5', sonnet: 'claude-sonnet-5-5', haiku: 'claude-haiku-5-5' };
            const m = (names.find(x => x.startsWith('modell:')) || 'modell:sonnet').split(':')[1];

            const comments = await github.paginate(github.rest.issues.listComments, { ...context.repo, issue_number: pr.number, per_page: 100 });
            const runde = comments.filter(c => (c.body || '').includes('<!-- automatik-runde -->')).length + 1;
            if (runde > Number(process.env.MAX_RUNDEN)) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issueNr,
                body: `Automatik: nach ${runde - 1} Reparatur-Runden für PR #${pr.number} keine Freigabe. Bitte ansehen, dann Label \`braucht-hilfe\` entfernen und den Workflow „Pruefen“ für \`${branch}\` von Hand starten.` });
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issueNr, labels: ['braucht-hilfe'] });
              return stop('too many rounds');
            }
            const c = process.env.CI_CONCLUSION;
            const modus = c === 'success' ? 'gruen' : (['failure', 'timed_out'].includes(c) ? 'rot' : null);
            if (!modus) return stop(`CI conclusion ${c}`);
            core.setOutput('modus', modus);
            core.setOutput('pr', String(pr.number));
            core.setOutput('issue', String(issueNr));
            core.setOutput('runde', String(runde));
            core.setOutput('model', models[m] || models.sonnet);
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || '');

      - name: Git identity
        if: steps.lage.outputs.modus != 'stop'
        run: |
          git config user.name "Automatik"
          git config user.email "automatik@users.noreply.github.com"

      - name: Fetch CI log
        if: steps.lage.outputs.modus == 'rot'
        run: gh run view "$CI_RUN_ID" --log-failed 2>/dev/null | tail -n 400 > "$RUNNER_TEMP/ci.log" || true

      - name: Merge main
        id: merge
        if: steps.lage.outputs.modus == 'gruen'
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main HEAD; then
            echo "status=aktuell" >> "$GITHUB_OUTPUT"
          elif git merge --no-edit origin/main; then
            echo "status=gemergt" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/konflikt.txt"
            echo "status=konflikt" >> "$GITHUB_OUTPUT"
          fi

      - name: Build repair prompt (CI or conflict)
        id: rep
        if: steps.lage.outputs.modus == 'rot' || steps.merge.outputs.status == 'konflikt'
        uses: actions/github-script@v7
        env:
          PR: ${{ steps.lage.outputs.pr }}
          ISSUE: ${{ steps.lage.outputs.issue }}
          TITLE: ${{ steps.lage.outputs.title }}
          RUNDE: ${{ steps.lage.outputs.runde }}
          KONFLIKT: ${{ steps.merge.outputs.status == 'konflikt' }}
        with:
          script: |
            const fs = require('fs'); const tmp = process.env.RUNNER_TEMP;
            const konflikt = process.env.KONFLIKT === 'true';
            const art = konflikt ? 'Merge-Konflikt mit main auflösen' : 'Fehlgeschlagene CI reparieren';
            const details = konflikt
              ? 'Dateien mit Konflikt:\n\n' + fs.readFileSync(`${tmp}/konflikt.txt`, 'utf8')
              : 'Ende des CI-Logs der fehlgeschlagenen Schritte:\n\n```\n' + (fs.existsSync(`${tmp}/ci.log`) ? fs.readFileSync(`${tmp}/ci.log`, 'utf8') : '(kein Log)') + '\n```';
            const p = fs.readFileSync('.github/automatik/reparieren.md', 'utf8')
              .replaceAll('{{BRANCH}}', process.env.BRANCH).replaceAll('{{PR}}', process.env.PR)
              .replaceAll('{{ISSUE}}', process.env.ISSUE).replaceAll('{{TITEL}}', process.env.TITLE)
              .replaceAll('{{RUNDE}}', process.env.RUNDE).replaceAll('{{ART}}', art)
              .replaceAll('{{DETAILS}}', details).replaceAll('{{ABBRUCH}}', `${tmp}/abbruch.md`);
            core.setOutput('prompt', p); core.setOutput('art', art);

      - name: Claude repairs
        if: steps.rep.outputs.prompt != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AUTOMATIK_TOKEN }}
          prompt: ${{ steps.rep.outputs.prompt }}
          claude_args: |
            --model ${{ steps.lage.outputs.model }}
            --max-turns 250
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,WebFetch,Skill,Task,TodoWrite"

      - name: Build review prompt
        id: revprompt
        if: steps.merge.outputs.status == 'aktuell'
        uses: actions/github-script@v7
        env:
          PR: ${{ steps.lage.outputs.pr }}
          ISSUE: ${{ steps.lage.outputs.issue }}
          TITLE: ${{ steps.lage.outputs.title }}
          BODY: ${{ steps.lage.outputs.body }}
        with:
          script: |
            const fs = require('fs');
            core.setOutput('prompt', fs.readFileSync('.github/automatik/pruefen.md', 'utf8')
              .replaceAll('{{BRANCH}}', process.env.BRANCH).replaceAll('{{PR}}', process.env.PR)
              .replaceAll('{{ISSUE}}', process.env.ISSUE).replaceAll('{{TITEL}}', process.env.TITLE)
              .replaceAll('{{BODY}}', process.env.BODY));

      - name: Claude Opus reviews
        id: review
        if: steps.revprompt.outputs.prompt != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AUTOMATIK_TOKEN }}
          prompt: ${{ steps.revprompt.outputs.prompt }}
          claude_args: |
            --model claude-opus-5-5
            --max-turns 150
            --allowedTools "Bash,Read,Glob,Grep,Skill,Task"
            --json-schema '{"type":"object","properties":{"freigabe":{"type":"boolean"},"zusammenfassung":{"type":"string"},"befunde":{"type":"array","items":{"type":"string"}},"hinweise":{"type":"array","items":{"type":"string"}}},"required":["freigabe","zusammenfassung","befunde"]}'

      - name: Post review and build fix prompt
        id: befunde
        if: steps.review.outputs.structured_output != ''
        uses: actions/github-script@v7
        env:
          REVIEW: ${{ steps.review.outputs.structured_output }}
          PR: ${{ steps.lage.outputs.pr }}
          ISSUE: ${{ steps.lage.outputs.issue }}
          TITLE: ${{ steps.lage.outputs.title }}
          RUNDE: ${{ steps.lage.outputs.runde }}
        with:
          script: |
            const fs = require('fs'); const tmp = process.env.RUNNER_TEMP;
            const r = JSON.parse(process.env.REVIEW);
            const list = (t, a) => a && a.length ? `\n\n**${t}**\n` + a.map(x => `- ${x}`).join('\n') : '';
            await github.rest.issues.createComment({ ...context.repo, issue_number: Number(process.env.PR),
              body: `### Review (Opus 5.5): ${r.freigabe ? 'Freigabe ✅' : 'Änderungen nötig'}\n\n${r.zusammenfassung}${list('Befunde', r.befunde)}${list('Hinweise (nicht blockierend)', r.hinweise)}` });
            core.setOutput('freigabe', r.freigabe ? 'ja' : 'nein');
            if (!r.freigabe) {
              const p = fs.readFileSync('.github/automatik/reparieren.md', 'utf8')
                .replaceAll('{{BRANCH}}', process.env.BRANCH).replaceAll('{{PR}}', process.env.PR)
                .replaceAll('{{ISSUE}}', process.env.ISSUE).replaceAll('{{TITEL}}', process.env.TITLE)
                .replaceAll('{{RUNDE}}', process.env.RUNDE).replaceAll('{{ART}}', 'Review-Befunde beheben')
                .replaceAll('{{DETAILS}}', r.befunde.map(x => `- ${x}`).join('\n'))
                .replaceAll('{{ABBRUCH}}', `${tmp}/abbruch.md`);
              core.setOutput('prompt', p);
            }

      - name: Claude fixes review findings
        if: steps.befunde.outputs.prompt != ''
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AUTOMATIK_TOKEN }}
          prompt: ${{ steps.befunde.outputs.prompt }}
          claude_args: |
            --model ${{ steps.lage.outputs.model }}
            --max-turns 250
            --allowedTools "Bash,Read,Write,Edit,MultiEdit,Glob,Grep,WebFetch,Skill,Task,TodoWrite"

      - name: Push changes
        id: push
        if: >-
          steps.rep.outputs.prompt != '' ||
          steps.merge.outputs.status == 'gemergt' ||
          steps.befunde.outputs.prompt != ''
        env:
          PR: ${{ steps.lage.outputs.pr }}
          RUNDE: ${{ steps.lage.outputs.runde }}
          ZAEHLT: ${{ steps.merge.outputs.status != 'gemergt' }}
          ART: ${{ steps.rep.outputs.art || (steps.befunde.outputs.prompt != '' && 'Review-Befunde beheben') || 'main eingemergt' }}
        run: |
          if [ -f "$RUNNER_TEMP/abbruch.md" ]; then echo "abbruch=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -f .git/MERGE_HEAD ]; then
            if git grep -n -E '^(<<<<<<<|>>>>>>>)' -- $(cat "$RUNNER_TEMP/konflikt.txt" 2>/dev/null) >/dev/null 2>&1; then
              echo "Konfliktmarker nicht vollständig aufgelöst." > "$RUNNER_TEMP/abbruch.md"
              echo "abbruch=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            git add -A
            git commit --no-edit
          fi
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "Apply automated fixes (round $RUNDE)"
          fi
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$BRANCH"
          if [ "$ZAEHLT" = "true" ]; then MARKER="<!-- automatik-runde -->"; else MARKER="<!-- automatik-merge -->"; fi
          gh pr comment "$PR" --body "$MARKER
          Automatik, Runde $RUNDE: $ART – neue CI läuft."

      - name: Merge PR
        if: steps.befunde.outputs.freigabe == 'ja'
        env:
          PR: ${{ steps.lage.outputs.pr }}
          ISSUE: ${{ steps.lage.outputs.issue }}
        run: |
          if gh pr merge "$PR" --squash --delete-branch; then
            gh issue close "$ISSUE" --reason completed || true
            gh issue edit "$ISSUE" --remove-label in-arbeit || true
          else
            # main moved in the meantime: run again, which merges main first
            gh workflow run pruefen.yml -f branch="$BRANCH"
          fi

      - name: Mark issue as stuck
        if: failure() || steps.push.outputs.abbruch == '1'
        uses: actions/github-script@v7
        env:
          ISSUE: ${{ steps.lage.outputs.issue }}
        with:
          script: |
            const fs = require('fs');
            const n = Number(process.env.ISSUE || process.env.BRANCH.replace('issue-', ''));
            const f = `${process.env.RUNNER_TEMP}/abbruch.md`;
            const reason = fs.existsSync(f) ? fs.readFileSync(f, 'utf8') : 'The run failed - see the workflow log.';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: n,
              body: `Automatik ist beim Prüfen hängen geblieben ([Lauf](${run})).\n\n${reason}\n\nNach der Klärung das Label \`braucht-hilfe\` entfernen und „Pruefen“ für \`${process.env.BRANCH}\` von Hand starten.` });
            await github.rest.issues.addLabels({ ...context.repo, issue_number: n, labels: ['braucht-hilfe'] });
