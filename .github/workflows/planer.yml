# Starts every open "auto" issue whose dependencies are closed, up to
# MAX_PARALLEL at a time. Does nothing unless the repository variable
# AUTOMATIK is "an" (the kill switch, docs/VORGEHEN.md).
name: Planer

on:
  workflow_dispatch:
  push:
    branches: [main]
  issues:
    types: [closed, reopened, unlabeled]
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: planer
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: write

jobs:
  planen:
    if: vars.AUTOMATIK == 'an'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        env:
          MAX_PARALLEL: ${{ vars.MAX_PARALLEL || '8' }}
        with:
          script: |
            const max = Number(process.env.MAX_PARALLEL) || 8;
            const all = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', per_page: 100,
            });
            const issues = all.filter(i => !i.pull_request);
            const byNr = new Map(issues.map(i => [i.number, i]));
            const names = i => i.labels.map(l => typeof l === 'string' ? l : l.name);
            const open = issues.filter(i => i.state === 'open' && names(i).includes('auto'));
            let running = open.filter(i => names(i).includes('in-arbeit')).length;
            core.info(`open auto issues: ${open.length}, running: ${running}, max: ${max}`);

            const deps = i => {
              const m = (i.body || '').match(/Abhängig von:([^\n]*)/);
              return m ? [...m[1].matchAll(/#(\d+)/g)].map(x => Number(x[1])) : [];
            };
            const candidates = open
              .filter(i => !names(i).includes('in-arbeit') && !names(i).includes('braucht-hilfe'))
              .sort((a, b) => a.number - b.number);

            for (const issue of candidates) {
              if (running >= max) break;
              const missing = deps(issue).filter(d => byNr.get(d)?.state !== 'closed');
              if (missing.length) {
                core.info(`#${issue.number} waits for ${missing.map(d => '#' + d).join(', ')}`);
                continue;
              }
              await github.rest.issues.addLabels({ ...context.repo, issue_number: issue.number, labels: ['in-arbeit'] });
              await github.rest.actions.createWorkflowDispatch({
                ...context.repo, workflow_id: 'umsetzen.yml', ref: 'main',
                inputs: { issue: String(issue.number) },
              });
              running++;
              core.info(`started #${issue.number}`);
            }
