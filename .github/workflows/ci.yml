# Tests on every push to main and every pull request
# (docs/spec/05-entwicklung.md section 4).
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI runs the branch's code and never writes.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mariadb:
        # Same server as the target host (docs/hosting-befunde.md); from
        # mirror.gcr.io because Docker Hub throttles anonymous pulls.
        image: mirror.gcr.io/library/mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: ci-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: pdo_mysql, zip, gd, sodium, curl, mbstring, fileinfo, dom
          coverage: none
          # Both trace settings are left in the WORSE of the two possible
          # states (arguments kept, parameters not capped) - worse than the
          # target host itself: the tests have to hold there.
          ini-values: error_reporting=E_ALL, display_errors=On, zend.assertions=1, zend.exception_ignore_args=0, zend.exception_string_param_max_len=15

      - name: Validate composer files
        run: composer validate --strict --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint every PHP file
        run: find app bin docker/web migrations public tests tools -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # setup.php is generated from bin/setup.template.php plus the shared
      # update classes (04 section 2); a stale copy would install with old
      # download code.
      - name: Verify generated setup.php is up to date
        run: |
          php bin/build_setup.php
          git diff --exit-code setup.php
          php -l setup.php

      - name: PHPUnit (deprecations, notices and warnings fail the build)
        run: vendor/bin/phpunit
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: 3306
          TEST_DB_USER: root
          TEST_DB_PASSWORD: ci-root
          # A missing database fails the build instead of skipping the
          # database tests.
          TEST_DB_REQUIRED: '1'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The quoted glob is expanded by node itself, so the step also holds
      # while tests/js/ has no test file.
      - name: JavaScript tests
        run: node --test 'tests/js/**/*.test.js'

  # tools/altdaten-umwandeln.ps1 (docs/spec/10-import.md section 3) runs once
  # on a Windows PC. Its output must be byte-identical to the expected files
  # the PHPUnit tests check - on Windows PowerShell 5.1 (what Windows ships)
  # and on PowerShell 7.
  altdaten:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, ps: powershell }
          - { os: windows-latest, ps: pwsh }
          - { os: ubuntu-latest, ps: pwsh }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Convert the invented sample export
        run: |
          ordner=ausgabe/altdaten
          mkdir -p "$ordner"
          cp tests/Fixtures/altdaten/mitglieder.xlsx tests/Fixtures/altdaten/familien.xlsx "$ordner/"
          ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File tools/altdaten-umwandeln.ps1 -Ordner "$ordner" -Stichtag 01.10.2026

      - name: Output equals the expected files
        run: |
          ordner=ausgabe/altdaten
          diff -u tests/Fixtures/altdaten/erwartet-import.csv "$ordner/import.csv"
          diff -u tests/Fixtures/altdaten/erwartet-zusammenfassung.txt "$ordner/zusammenfassung.txt"
          cmp tests/Fixtures/altdaten/erwartet-import.csv "$ordner/import.csv"
          cmp tests/Fixtures/altdaten/erwartet-zusammenfassung.txt "$ordner/zusammenfassung.txt"

      # Pia (1009, born 23.12.2012) is a child on 01.10.2026 but an adult
      # family member on 01.01.2031.
      - name: The reference day decides child or adult
        run: |
          ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File tools/altdaten-umwandeln.ps1 \
            -Mitglieder tests/Fixtures/altdaten/mitglieder.xlsx -Familien tests/Fixtures/altdaten/familien.xlsx \
            -Ausgabe ausgabe/spaeter.csv -Stichtag 01.01.2031
          grep -q '^1009;.*;elternteil;' ausgabe/spaeter.csv

      - name: Wrong files and arguments stop with an error
        run: |
          set +e
          ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File tools/altdaten-umwandeln.ps1 \
            -Mitglieder tests/Fixtures/altdaten/familien.xlsx -Familien tests/Fixtures/altdaten/mitglieder.xlsx -Ausgabe ausgabe/falsch.csv
          [ $? -eq 1 ] || { echo "swapped files must fail"; exit 1; }
          [ ! -e ausgabe/falsch.csv ] || { echo "no output on failure"; exit 1; }
          ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File tools/altdaten-umwandeln.ps1 -Ordner ausgabe/gibt-es-nicht
          [ $? -eq 1 ] || { echo "missing files must fail"; exit 1; }
          ${{ matrix.ps }} -NoProfile -ExecutionPolicy Bypass -File tools/altdaten-umwandeln.ps1 -Ordner ausgabe/altdaten -Stichtag gestern
          [ $? -eq 1 ] || { echo "bad reference day must fail"; exit 1; }
          exit 0
